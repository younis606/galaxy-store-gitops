apiVersion: apps/v1
kind: Deployment
metadata:
  name: galaxy-store
  namespace: default
  labels:
    app: galaxy-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: galaxy-store
  template:
    metadata:
      labels:
        app: galaxy-store
    spec:
      containers:
        - name: galaxy-store
          image: younis606/galaxy-store:48d53c5af85ff06fc2664234448e601d3945bda9
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"

apiVersion: v1
kind: Service
metadata:
  name: galaxy-store-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: galaxy-store
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
