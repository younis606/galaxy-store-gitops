apiVersion: apps/v1
kind: Deployment
metadata:
  name: galaxy-store
  namespace: default
  labels:
    app: galaxy-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: galaxy-store
  template:
    metadata:
      labels:
        app: galaxy-store
    spec:
      containers:
        - name: galaxy-store
          image: younis606/galaxy-store:1d9d06505eed027bfe79f513df3c09081a8c4c0a
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
          envFrom:
            - configMapRef:
              name: galaxy-store-config
apiVersion: v1
kind: Service
metadata:
  name: galaxy-store-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: galaxy-store
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
